apiVersion: v1
kind: ConfigMap
metadata:
  name: zero-trust-gateway-config
data:
  AUTH_MODE: "oidc"
  OIDC_ISSUER: "https://identity.example.com/"
  OIDC_AUDIENCE: "zero-trust-gateway"
  OIDC_JWKS_URL: "https://identity.example.com/.well-known/jwks.json"
  OIDC_ROLE_CLAIM: "role"
  OIDC_TENANT_CLAIM: "tenant_id"
  DEFAULT_POLICY_MODE: "shadow"
  EVENT_RETENTION_DAYS: "30"
  MONITOR_RISK: "30"
  BLOCK_RISK: "60"
  REVOKE_RISK: "85"
  CORS_ORIGINS: "https://security.example.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zero-trust-api
  labels: {app: zero-trust-api}
spec:
  replicas: 3
  selector:
    matchLabels: {app: zero-trust-api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: zero-trust-api}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: zero-trust-api}}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: zero-trust-api}}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: registry.example.com/security/zero-trust-api:REPLACE_WITH_IMMUTABLE_TAG
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: zero-trust-gateway-config}
          env:
            - name: MONGO_URI
              valueFrom: {secretKeyRef: {name: zero-trust-gateway-secrets, key: MONGO_URI}}
            - name: TOKEN_REFERENCE_KEY
              valueFrom: {secretKeyRef: {name: zero-trust-gateway-secrets, key: TOKEN_REFERENCE_KEY}}
            - name: IDENTITY_HASH_KEY
              valueFrom: {secretKeyRef: {name: zero-trust-gateway-secrets, key: IDENTITY_HASH_KEY}}
            - name: MONGO_DB
              value: zero_trust_gateway
          startupProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ClusterIP
  selector: {app: zero-trust-api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zero-trust-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: zero-trust-api}
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
    - type: Resource
      resource:
        name: memory
        target: {type: Utilization, averageUtilization: 75}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies: [{type: Percent, value: 100, periodSeconds: 60}]
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{type: Percent, value: 25, periodSeconds: 60}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zero-trust-api
spec:
  minAvailable: 2
  selector: {matchLabels: {app: zero-trust-api}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zero-trust-console
  labels: {app: zero-trust-console}
spec:
  replicas: 2
  selector:
    matchLabels: {app: zero-trust-console}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: zero-trust-console}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: console
          image: registry.example.com/security/zero-trust-console:REPLACE_WITH_IMMUTABLE_TAG
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          env:
            - name: API_URL
              value: ""
            - name: AUTH_MODE
              value: oidc
            - name: OIDC_AUTHORITY
              value: "https://identity.example.com/"
            - name: OIDC_CLIENT_ID
              valueFrom: {secretKeyRef: {name: zero-trust-gateway-secrets, key: OIDC_CLIENT_ID}}
            - name: OIDC_SCOPE
              value: "openid profile"
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: zero-trust-console
spec:
  type: ClusterIP
  selector: {app: zero-trust-console}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zero-trust-console
spec:
  minAvailable: 1
  selector: {matchLabels: {app: zero-trust-console}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-only-from-console-and-monitoring
spec:
  podSelector: {matchLabels: {app: zero-trust-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: zero-trust-console}}
      ports: [{protocol: TCP, port: 8000}]
    - from:
        - namespaceSelector: {matchLabels: {monitoring: enabled}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: 8000}]
